[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpipe"
version = "0.1.0"
description = "Standalone differential-diagnosis pipeline (Stage A)"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["lightgbm", "sklearn.*", "scipy.*", "pandas", "transformers", "torch", "kagglehub"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_*.py" = ["E501"]
"scripts/v2_conditions_source*.py" = ["E501"]
