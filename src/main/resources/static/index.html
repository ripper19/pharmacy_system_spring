<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy</title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
    <div class="container">
        <div class="brand">
            <div class="brand-mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="brandGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1769e8"/><stop offset="1" stop-color="#53b9ff"/></linearGradient></defs><g transform="rotate(-45 12 12)"><rect x="3" y="8" width="18" height="8" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/></g></svg></div>
            <div class="brand-name">PHARMACARE</div>
        </div>

        <form method="post" id="loginform" novalidate>

            <h1 class="form-title">Sign in</h1>

            <div id="loginMessage" class="form-message" role="alert"></div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="email" class="Myinput" name="email" id="email" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" class="Myinput" name="password" id="password" autocomplete="current-password" required>
                    <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password" aria-pressed="false">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="lgnbtn">Sign In</button>

            <a href="#">Forgot password?</a>

        </form>
    </div>
    <p class="login-footer">© 2026 PharmaCare · Enterprise POS</p>
</div>
<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
